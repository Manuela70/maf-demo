<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAF Perú — Plataforma de Ventas FC v2.0 [03-AGO-2026]</title>
  
  <!-- React Dependencies (CDN alternativa más rápida) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fallback si las CDNs fallan -->

    if (typeof React === 'undefined') {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./src/styles/custom.css?v=20260806-1144">
  
  <style>
    /* Animación para elementos con pulse */
    @keyframes pulse-custom {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-custom {
      animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* Estilos para OTP inputs */
    .otp-input {
      width: 3rem;
      height: 3rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      border: 2px solid #d1d5db;
      border-radius: 0.5rem;
      outline: none;
    }
    .otp-input:focus {
      border-color: #374151;
    }
    
    /* Anotaciones */
    .note {
      padding: 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      line-height: 1.25rem;
    }
  </style>
</head>
<body>
  <!-- Punto de montaje de React -->
  <div id="root"></div>
  
  <!-- Aplicación principal -->
  <script type="module" src="./src/App.js?v=20260806-1301"></script>
</body>
</html>
